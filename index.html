<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>3D Physics Sandbox</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none;color:#fff;font:600 12px system-ui;text-shadow:0 1px 3px #000}#hint{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));padding:6px 8px;background:#0006;border-radius:8px}#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}#cross:before{left:8px;top:2px;width:2px;height:14px}#cross:after{left:2px;top:8px;width:14px;height:2px}#lookPad{position:absolute;left:50%;right:0;top:0;bottom:0;pointer-events:auto}#joy{position:absolute;width:126px;height:126px;border:2px solid #fff8;border-radius:50%;background:#fff1;pointer-events:none;display:none;transform:translate(-50%,-50%)}#knob{position:absolute;width:54px;height:54px;left:34px;top:34px;border:2px solid #fff;border-radius:50%;background:#ffffff88}.btn{position:absolute;width:62px;height:62px;border:2px solid #fffb;border-radius:50%;background:#233a59cc;color:#fff;font:800 11px system-ui;pointer-events:auto;text-shadow:0 1px 2px #000}.btn:active{transform:scale(.93);background:#4673aacc}#jump{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom))}#grab{right:max(84px,calc(env(safe-area-inset-right) + 84px));bottom:max(18px,calc(env(safe-area-inset-bottom) + 18px))}#throw{right:max(22px,calc(env(safe-area-inset-right) + 22px));bottom:max(84px,calc(env(safe-area-inset-bottom) + 84px))}#reset{right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));width:50px;height:34px;border-radius:9px}@media(max-height:500px){#hint{font-size:10px}.btn{width:54px;height:54px}#grab{right:74px;bottom:12px}#throw{right:14px;bottom:72px}#jump{right:10px;bottom:10px}}@media(max-width:600px) and (orientation:portrait){#hint{max-width:48vw}.btn{width:56px;height:56px}#grab{right:72px}#throw{bottom:74px}}
</style></head><body><canvas id="c"></canvas><div id="ui"><div id="hint">Left half: floating move stick<br>Right half: drag to look</div><div id="cross"></div><div id="lookPad"></div><div id="joy"><div id="knob"></div></div><button class="btn" id="jump">JUMP</button><button class="btn" id="grab">GRAB</button><button class="btn" id="throw">THROW</button><button class="btn" id="reset">RESET</button></div><script>
'use strict';
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false,desynchronized:true});let W,H,D,F;
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);F=H*.5/Math.tan(Math.PI*70/360)}addEventListener('resize',resize);resize();
class V{constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z}set(x,y,z){this.x=x;this.y=y;this.z=z;return this}copy(v){return this.set(v.x,v.y,v.z)}add(v){return new V(this.x+v.x,this.y+v.y,this.z+v.z)}sub(v){return new V(this.x-v.x,this.y-v.y,this.z-v.z)}mul(s){return new V(this.x*s,this.y*s,this.z*s)}dot(v){return this.x*v.x+this.y*v.y+this.z*v.z}cross(v){return new V(this.y*v.z-this.z*v.y,this.z*v.x-this.x*v.z,this.x*v.y-this.y*v.x)}len(){return Math.hypot(this.x,this.y,this.z)}norm(){return this.mul(1/(this.len()||1))}}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
function rot(v,r){let x=v.x,y=v.y,z=v.z,c=Math.cos(r.x),s=Math.sin(r.x);[y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(r.y);s=Math.sin(r.y);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(r.z);s=Math.sin(r.z);[x,y]=[x*c-y*s,x*s+y*c];return new V(x,y,z)}
const CV=[new V(-.5,-.5,-.5),new V(.5,-.5,-.5),new V(.5,.5,-.5),new V(-.5,.5,-.5),new V(-.5,-.5,.5),new V(.5,-.5,.5),new V(.5,.5,.5),new V(-.5,.5,.5)],CT=[[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[3,7,6],[3,6,2],[1,2,6],[1,6,5],[0,4,7],[0,7,3]];
class B{constructor(x,y,z,sx,sy,sz,col,m=1){this.p=new V(x,y,z);this.s=new V(sx,sy,sz);this.v=new V;this.r=new V;this.w=new V;this.col=col;this.im=m?1/m:0;this.held=false}min(){return new V(this.p.x-this.s.x/2,this.p.y-this.s.y/2,this.p.z-this.s.z/2)}max(){return new V(this.p.x+this.s.x/2,this.p.y+this.s.y/2,this.p.z+this.s.z/2)}}
const stat=[new B(0,-1,8,50,2,50,'#527c3a',0),new B(0,2,25,26,4,1,'#737b89',0),new B(-13,2,8,1,4,34,'#68717e',0),new B(13,2,8,1,4,34,'#68717e',0),new B(0,1,14,5,2,2,'#856c4d',0),new B(-6,.5,7,4,1,4,'#7c6549',0),new B(7,1.5,4,3,3,3,'#596b86',0)];
let bs=[];const cols=['#e45757','#e7a93c','#4cbf76','#4f8fe8','#a66de2','#e46fa6','#45bfc5'];function spawn(){bs=[];for(let i=0;i<18;i++){let s=.65+Math.random()*.6,b=new B((i%6-2.5)*1.7,1.1+(i/6|0)*1.5,7+(i/6|0)*1.7,s,s,s,cols[i%7],1);b.r.set(Math.random(),Math.random(),0);bs.push(b)}}spawn();
const P={p:new V(0,1.75,-6),v:new V,r:.42,h:1.75,yaw:0,pitch:0,on:false,held:null,dist:2.5},cam=new V;
function fwd(){let q=Math.cos(P.pitch);return new V(Math.sin(P.yaw)*q,Math.sin(P.pitch),Math.cos(P.yaw)*q)}function ff(){return new V(Math.sin(P.yaw),0,Math.cos(P.yaw))}function right(){return new V(Math.cos(P.yaw),0,-Math.sin(P.yaw))}
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space')jump();if(e.code==='KeyE')grab();if(e.code==='KeyF')throwIt()});addEventListener('keyup',e=>keys[e.code]=0);
let move={x:0,y:0},moveId=null,lookId=null,lastX=0,lastY=0;const joy=document.querySelector('#joy'),knob=document.querySelector('#knob');
function moveStart(e){if(e.clientX>W*.5||moveId!==null||e.target.closest('button'))return;moveId=e.pointerId;c.setPointerCapture(e.pointerId);joy.style.display='block';joy.style.left=e.clientX+'px';joy.style.top=e.clientY+'px';joy.dataset.x=e.clientX;joy.dataset.y=e.clientY;e.preventDefault()}
function moveNow(e){if(e.pointerId!==moveId)return;let dx=e.clientX-+joy.dataset.x,dy=e.clientY-+joy.dataset.y,m=42,d=Math.hypot(dx,dy);if(d>m){dx*=m/d;dy*=m/d}move.x=dx/m;move.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
function moveEnd(e){if(e.pointerId!==moveId)return;moveId=null;move.x=move.y=0;joy.style.display='none';knob.style.transform='none'}
c.addEventListener('pointerdown',moveStart);c.addEventListener('pointermove',moveNow);c.addEventListener('pointerup',moveEnd);c.addEventListener('pointercancel',moveEnd);
const pad=document.querySelector('#lookPad');pad.addEventListener('pointerdown',e=>{if(e.target.closest('button')||lookId!==null)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;pad.setPointerCapture(e.pointerId);e.preventDefault()});pad.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;P.yaw-=dx*.0042;P.pitch=clamp(P.pitch-dy*.0038,-1.35,1.35)});function lookEnd(e){if(e.pointerId===lookId)lookId=null}pad.addEventListener('pointerup',lookEnd);pad.addEventListener('pointercancel',lookEnd);
function jump(){if(P.on){P.v.y=7.2;P.on=false}}
function ray(o,d,b,max){let mn=b.min(),mx=b.max(),a=0,z=max;for(let k of['x','y','z']){if(Math.abs(d[k])<1e-8){if(o[k]<mn[k]||o[k]>mx[k])return null;continue}let n=(mn[k]-o[k])/d[k],f=(mx[k]-o[k])/d[k];if(n>f)[n,f]=[f,n];a=Math.max(a,n);z=Math.min(z,f);if(a>z)return null}return a}
function grab(){if(P.held){P.held.held=false;P.held.v.copy(P.v);P.held=null;return}let best=null,t=4.5;for(let b of bs){let q=ray(cam,fwd(),b,t);if(q!==null&&q<t){t=q;best=b}}if(best){P.held=best;best.held=true;best.v.set(0,0,0);P.dist=clamp(t+.8,1.7,3.7)}}function throwIt(){if(!P.held)return;let b=P.held;b.held=false;b.v=fwd().mul(13).add(P.v);b.w.set(4,-3,2);P.held=null}
for(let [id,fn]of[['jump',jump],['grab',grab],['throw',throwIt]])document.querySelector('#'+id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn()});document.querySelector('#reset').addEventListener('pointerdown',e=>{e.stopPropagation();P.p.set(0,1.75,-6);P.v.set(0,0,0);P.yaw=P.pitch=0;P.held=null;spawn()});
function ov(a,b){let A=a.min(),X=a.max(),B=b.min(),Y=b.max();return A.x<Y.x&&X.x>B.x&&A.y<Y.y&&X.y>B.y&&A.z<Y.z&&X.z>B.z}
function staticSolve(b,s){if(!ov(b,s))return;let a=b.min(),x=b.max(),m=s.min(),M=s.max(),q=[[M.x-a.x,'x',1],[x.x-m.x,'x',-1],[M.y-a.y,'y',1],[x.y-m.y,'y',-1],[M.z-a.z,'z',1],[x.z-m.z,'z',-1]].sort((u,v)=>u[0]-v[0])[0];b.p[q[1]]+=q[0]*q[2];let vn=b.v[q[1]]*q[2];if(vn<0)b.v[q[1]]-=1.2*vn*q[2];if(q[1]==='y'){b.v.x*=.78;b.v.z*=.78}}
function pair(a,b){if(a.held||b.held||!ov(a,b))return;let ds=[[(a.s.x+b.s.x)/2-Math.abs(a.p.x-b.p.x),'x'],[(a.s.y+b.s.y)/2-Math.abs(a.p.y-b.p.y),'y'],[(a.s.z+b.s.z)/2-Math.abs(a.p.z-b.p.z),'z']].sort((u,v)=>u[0]-v[0]),[pen,k]=ds[0],sg=a.p[k]<b.p[k]?-1:1,total=a.im+b.im;a.p[k]+=sg*pen*a.im/total;b.p[k]-=sg*pen*b.im/total;let vn=(a.v[k]-b.v[k])*sg;if(vn<0){let j=-1.18*vn/total;a.v[k]+=j*sg*a.im;b.v[k]-=j*sg*b.im}}
function pb(){return{min:()=>new V(P.p.x-P.r,P.p.y-P.h,P.p.z-P.r),max:()=>new V(P.p.x+P.r,P.p.y,P.p.z+P.r)}}function pmove(k,d){P.p[k]+=d;for(let s of stat)ps(s,k,d);for(let b of bs)if(!b.held)ps(b,k,d)}function ps(s,k,d){if(!ov(pb(),s))return;let m=s.min(),M=s.max();if(k==='x'){P.p.x=d>0?m.x-P.r:M.x+P.r;P.v.x=0}else if(k==='z'){P.p.z=d>0?m.z-P.r:M.z+P.r;P.v.z=0}else{if(d<0){P.p.y=M.y+P.h;P.on=true}else P.p.y=m.y;P.v.y=0}}
function step(dt){let x=move.x+(keys.KeyD?1:0)-(keys.KeyA?1:0),z=-move.y+(keys.KeyW?1:0)-(keys.KeyS?1:0),l=Math.hypot(x,z);if(l>1){x/=l;z/=l}let wish=right().mul(x).add(ff().mul(z)),t=clamp((P.on?28:8)*dt,0,1);P.v.x=lerp(P.v.x,wish.x*(P.on?5.6:4.3),t);P.v.z=lerp(P.v.z,wish.z*(P.on?5.6:4.3),t);P.v.y-=18*dt;P.on=false;pmove('x',P.v.x*dt);pmove('z',P.v.z*dt);pmove('y',P.v.y*dt);cam.set(P.p.x,P.p.y-.14,P.p.z);for(let b of bs){if(b.held)continue;b.v.y-=18*dt;b.p=b.p.add(b.v.mul(dt));b.r=b.r.add(b.w.mul(dt));b.w=b.w.mul(.995);for(let s of stat)staticSolve(b,s);if(b.p.y<-15){b.p.set(0,8,6);b.v.set(0,0,0)}}for(let p=0;p<2;p++)for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++)pair(bs[i],bs[j]);if(P.held){let b=P.held,target=cam.add(fwd().mul(P.dist));b.v=target.sub(b.p).mul(18).add(P.v.mul(.3));let l=b.v.len();if(l>18)b.v=b.v.mul(18/l);b.p=b.p.add(b.v.mul(dt));b.r.y+=dt;for(let s of stat)staticSolve(b,s)}if(P.p.y<-15){P.p.set(0,1.75,-6);P.v.set(0,0,0)}}
const near=.08,light=new V(-.35,.8,-.45).norm(),tris=[];function wc(p){let x=p.x-cam.x,y=p.y-cam.y,z=p.z-cam.z,c=Math.cos(-P.yaw),s=Math.sin(-P.yaw);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(-P.pitch);s=Math.sin(-P.pitch);[y,z]=[y*c-z*s,y*s+z*c];return new V(x,y,z)}function clip(poly){let o=[];for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length],A=a.z>=near,B=b.z>=near;if(A)o.push(a);if(A!==B){let t=(near-a.z)/(b.z-a.z);o.push(new V(lerp(a.x,b.x,t),lerp(a.y,b.y,t),near))}}return o}function proj(v){return{x:W/2+v.x*F/v.z,y:H/2-v.y*F/v.z,z:v.z}}function shade(h,k){let n=parseInt(h.slice(1),16),r=n>>16,q=n>>8&255,b=n&255;return`rgb(${Math.min(255,r*k)|0},${Math.min(255,q*k)|0},${Math.min(255,b*k)|0})`}
function mesh(b){let vs=CV.map(v=>rot(new V(v.x*b.s.x,v.y*b.s.y,v.z*b.s.z),b.r).add(b.p));for(let t of CT){let a=vs[t[0]],d=vs[t[1]],e=vs[t[2]],n=d.sub(a).cross(e.sub(a)).norm(),cen=a.add(d).add(e).mul(1/3);if(n.dot(cam.sub(cen))<=0)continue;let p=clip([wc(a),wc(d),wc(e)]);for(let i=1;i<p.length-1;i++){let A=proj(p[0]),B=proj(p[i]),C=proj(p[i+1]);tris.push({A,B,C,z:(A.z+B.z+C.z)/3,col:shade(b.col,.25+.75*Math.max(0,n.dot(light)))})}}}
function render(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#61a4dd');sky.addColorStop(.65,'#c3ddec');sky.addColorStop(1,'#dfe5ca');g.fillStyle=sky;g.fillRect(0,0,W,H);tris.length=0;for(let b of stat)mesh(b);for(let b of bs)mesh(b);tris.sort((a,b)=>b.z-a.z);for(let t of tris){g.beginPath();g.moveTo(t.A.x,t.A.y);g.lineTo(t.B.x,t.B.y);g.lineTo(t.C.x,t.C.y);g.closePath();g.fillStyle=t.col;g.fill();g.strokeStyle='#10151d55';g.lineWidth=.6;g.stroke()}document.querySelector('#grab').textContent=P.held?'DROP':'GRAB'}
let last=performance.now(),acc=0,fix=1/120;function loop(now){acc+=Math.min(.05,(now-last)/1000);last=now;for(let n=0;acc>=fix&&n<8;n++,acc-=fix)step(fix);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
