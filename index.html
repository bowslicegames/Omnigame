'use strict';
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl2',{antialias:true,alpha:false,depth:true,stencil:false,preserveDrawingBuffer:false});

// ---------- Scene / procedural world ----------
class Obj{constructor(mesh,pos,scale,color){this.mesh=mesh;this.p=pos;this.s=scale;this.r=new V();this.color=color;this.visible=true;this.parent=null;this.children=[];this.dynamic=false;this.v=new V();this.held=false;this.mass=1}}

function part(mesh,p,s,c,parent=null){const o=add(mesh,p,s,c);o.parent=parent;if(parent)parent.children.push(o);return o}

// ---------- Procedural terrain ----------
function terrainHeight(x,z){

  const b=Math.sin(x*.31+z*.17)*.28+Math.cos(x*.19-z*.27)*.22;
  const c=Math.sin((x+z)*.57)*.075;
  const radial=Math.max(0,Math.hypot(x,z)-13)*.035;
  return Math.max(-.05,a+b+c-radial);

function makeTerrainMesh(size=120,steps=160){

const terrainMesh=makeTerrainMesh();
add(terrainMesh,[0,0,0],[1,1,1],[.19,.34,.12]);

add(makeGroundPatchMesh(),[0,0,0],[1,1,1],[.23,.40,.14]);

const tree=buildDetailedTree();

const treeSpots=[[-7,-1,.72],[-5,6,.82],[5,5,.78],[7,-3,.95],[-8,8,.62],[8,8,.68],[-11,2,.76],[11,1,.82],[-10,-7,.62],[-4,-9,.70],[5,-8,.74],[11,-7,.58],[-13,7,.55],[13,7,.60],[-20,-8,.72],[19,-2,.8],[-24,10,.62],[25,7,.74],[-30,-4,.68],[31,-12,.58],[-35,15,.65],[36,4,.72],[-40,-18,.62],[42,-9,.7],[-15,-25,.76],[5,-30,.66],[23,-27,.72],[39,-27,.58],[-45,26,.55],[45,22,.62],[-50,0,.7],[50,8,.6]];
for(const [x,z,s] of treeSpots)placeTree(x,z,s);

// ---------- Procedural bushes ----------
function makeBushMesh(){const leaves=[];let seed=4401;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<90;i++){const t=rnd()*Math.PI*2,rr=Math.sqrt(rnd())*.85,p=new V(Math.cos(t)*rr,(rnd()-.15)*.9,Math.sin(t)*rr);leaves.push({p,d:new V(p.x*.7,.35+rnd()*.8,p.z*.7).norm(),l:.24+rnd()*.2,w:.07+rnd()*.07})}return makeLeafMesh(leaves)}
const bushMesh=makeBushMesh();
function placeBush(x,z,s){const y=terrainHeight(x,z);add(bushMesh,[x,y+.05,z],[s,s,s],[.10,.31,.09]);add(bushMesh,[x+s*.35,y+.04,z-s*.22],[s*.7,s*.75,s*.7],[.13,.38,.11])}
for(const [x,z,s] of [[-3,2,.9],[3,1,.8],[-6,3,.65],[6,0,.72],[-8,-4,.9],[8,-5,.82],[-2,-7,.72],[3,-10,.64],[-10,6,.62],[10,5,.7],[12,-2,.55],[-18,2,.7],[18,4,.65],[-22,-8,.82],[22,-10,.72],[-28,0,.62],[28,2,.7],[-34,9,.65],[34,11,.6],[-40,-6,.72],[40,-2,.66],[-12,-20,.75],[12,-22,.68],[30,-24,.6]])placeBush(x,z,s);

// A few procedural rocks give the terrain additional silhouettes for renderer testing.
const rockMesh=sphereMesh(12,7);
for(const [i,[x,z,s]] of [[-3,-2,.55],[4,-3,.72],[-7,-6,.48],[7,2,.42],[2,-5,.35],[18,8,.8],[-18,11,.65],[25,-12,.9],[-27,4,.7]].entries()){const y=terrainHeight(x,z);const rock=add(rockMesh,[x,y+s*.35,z],[s,s*.7,s],[.25,.27,.22]);rock.dynamic=true;rock.mass=1;rock.netId='rock-'+i}

// ---------- Multiplayer client ----------
// The WebGL renderer, procedural world, local physics and controls stay intact.
// This layer synchronizes players and rock actions with the separate Render server.
const MULTIPLAYER_URL='wss://omnibackend-sgb9.onrender.com/ws';
let socket=null,networkId=null,networkConnected=false,networkRetry=0,lastNetworkSend=0;
const remotePlayers=new Map(),remoteMeshes=new Map();
function num(v,d=0){return Number.isFinite(Number(v))?Number(v):d}
function xyz(v){if(!v)return null;return{x:num(v.x),y:num(v.y),z:num(v.z)}}
function yawOf(v){return num(v?.yaw??v?.rotation?.yaw??v?.rotation?.y,0)}
function applyRemotePlayer(p){
  const id=String(p.id??p.playerId??'');if(!id||id===String(networkId))return;
  const pos=xyz(p.position??p);if(!pos)return;
  let r=remotePlayers.get(id);
  if(!r){r={x:pos.x,y:pos.y,z:pos.z,yaw:yawOf(p),tx:pos.x,ty:pos.y,tz:pos.z,tyaw:yawOf(p)};remotePlayers.set(id,r);const body=add(meshes.cylinder,new V(),new V(.38,.9,.38),[.18,.48,.82]);remoteMeshes.set(id,body)}
  r.tx=pos.x;r.ty=pos.y;r.tz=pos.z;r.tyaw=yawOf(p);
}
function removeRemotePlayer(id){id=String(id);remotePlayers.delete(id);const body=remoteMeshes.get(id);if(body){const n=objects.indexOf(body);if(n>=0)objects.splice(n,1);remoteMeshes.delete(id)}}
function applyRock(r){
  const id=String(r.id??r.rockId??r.netId??'');if(!id)return;
  const o=objects.find(x=>x.netId===id);if(!o)return;
  const pos=xyz(r.position),vel=xyz(r.velocity);
  if(pos&&!o.held){o.p.set(pos.x,pos.y,pos.z)}
  if(vel&&!o.held){o.v.set(vel.x,vel.y,vel.z)}
  if(typeof r.held==='boolean'&&r.held!==o.held){o.held=r.held}
}
function processNetworkMessage(msg){
  if(!msg||typeof msg!=='object')return;
  if(msg.type==='welcome'){networkId=msg.id;return}
  if(msg.type==='playerJoined'||msg.type==='player')applyRemotePlayer(msg.player??msg);
  if(msg.type==='playerLeft')removeRemotePlayer(msg.id);
  if(msg.type==='players'){
    const seen=new Set();for(const pl of msg.players||[]){applyRemotePlayer(pl);seen.add(String(pl.id))}
    for(const id of [...remotePlayers.keys()])if(!seen.has(id))removeRemotePlayer(id);
  }
  if(msg.type==='playerUpdate'&&msg.player)applyRemotePlayer(msg.player);
  if(msg.type==='rockState')applyRock(msg);
  if(msg.type==='rockAction'&&msg.action)applyRock(msg.action);
}
function sendNetwork(obj){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify(obj))}
function connectMultiplayer(){
  try{socket=new WebSocket(MULTIPLAYER_URL)}catch(e){scheduleReconnect();return}
  socket.addEventListener('open',()=>{
    networkConnected=true;networkRetry=0;document.getElementById('status').textContent='Multiplayer connected';
    sendNetwork({type:'join',name:'Player',protocol:1});
  });
  socket.addEventListener('message',e=>{try{processNetworkMessage(JSON.parse(e.data))}catch(err){console.warn('Network message error',err)}});
  socket.addEventListener('close',()=>{networkConnected=false;document.getElementById('status').textContent='Multiplayer reconnecting…';scheduleReconnect()});
  socket.addEventListener('error',()=>{networkConnected=false});
}
function scheduleReconnect(){const delay=Math.min(10000,1000*Math.pow(2,networkRetry++));setTimeout(connectMultiplayer,delay)}
function networkTick(now){
  if(!networkConnected||now-lastNetworkSend<50)return;
  lastNetworkSend=now;
  sendNetwork({type:'input',input:{forward:input.moveY,side:input.moveX,jump:input.jump},position:{x:camPos.x,y:camPos.y,z:camPos.z},rotation:{yaw,pitch}});
}
connectMultiplayer();

// ---------- Camera + controls ----------
// ---------- Camera + controls ----------
const camPos=new V(0,terrainHeight(0,-8)+1.35,-8),proj=mat4(),viewMat=mat4(),modelMat=mat4(),normalMat=new Float32Array(9);
let yaw=0,pitch=-.10,camVelY=0;
const input={keys:Object.create(null),moveX:0,moveY:0,lookX:0,lookY:0,jump:false};
let grounded=false,held=null,grabDistance=4.2;
function forward(){const cp=Math.cos(pitch);return new V(Math.sin(yaw)*cp,Math.sin(pitch),Math.cos(yaw)*cp)}
function flatForward(){return new V(Math.sin(yaw),0,Math.cos(yaw))}
function right(){return new V(Math.cos(yaw),0,-Math.sin(yaw))}
function resetScene(){for(const o of objects)if(o.dynamic){o.held=false;o.v.set(0,0,0);o.p.y=terrainHeight(o.p.x,o.p.z)+o.s.y}camPos.set(0,terrainHeight(0,-8)+1.35,-8);camVelY=0;yaw=0;pitch=-.10;grounded=false;held=null;input.jump=false}
function rayGrab(){const f=forward(),origin=camPos;let best=null,bestD=grabDistance;for(const o of objects){if(!o.dynamic||o===held)continue;const q=o.p.sub(origin);const t=q.dot(f);if(t<.25||t>grabDistance)continue;const closest=origin.add(f.mul(t));const dist=o.p.sub(closest).len();const radius=Math.max(o.s.x,o.s.y,o.s.z)*1.35;if(dist<=radius&&t<bestD){best=o;bestD=t}}if(best){held=best;held.held=true;held.v.set(0,0,0);sendNetwork({type:'grab',rockId:held.netId});return true}return false}
function dropHeld(throwing=false){if(!held)return;const f=forward();if(throwing){held.v=f.mul(10);sendNetwork({type:'throw',rockId:held.netId,velocity:{x:held.v.x,y:held.v.y,z:held.v.z},position:{x:held.p.x,y:held.p.y,z:held.p.z}})}else sendNetwork({type:'drop',rockId:held.netId});held.held=false;held=null}
function toggleGrab(){if(held)dropHeld(false);else rayGrab()}
// ---------- Physics ----------
const GRAVITY=-18,FLOOR_FRICTION=.78,AIR_DRAG=.999;
function overlapAxis(a,b,axis){return (a.s[axis]+b.s[axis])-Math.abs(a.p[axis]-b.p[axis])}
function resolveDynamicStatic(a,b){if(b.isTrunkCollider)return resolveRockTreeCollision(a,b);const ox=overlapAxis(a,b,'x'),oy=overlapAxis(a,b,'y'),oz=overlapAxis(a,b,'z');if(ox<=0||oy<=0||oz<=0)return false;let axis='x',pen=ox;if(oy<pen){axis='y';pen=oy}if(oz<pen){axis='z';pen=oz}const sign=a.p[axis]>=b.p[axis]?1:-1;a.p[axis]+=sign*pen;if(axis==='y'){if(a.v.y*sign<0)a.v.y=-a.v.y*.42;a.v.x*=FLOOR_FRICTION;a.v.z*=FLOOR_FRICTION}else a.v[axis]*=-.35;return true}
function resolveRockTreeCollision(a,b){
 const rx=Math.max(a.s.x,a.s.z), ry=a.s.y;
 const dx=a.p.x-b.p.x, dz=a.p.z-b.p.z;
 const dist=Math.hypot(dx,dz), minDist=rx+b.trunkRadius;
 const treeBottom=b.p.y-b.trunkHalfHeight, treeTop=b.p.y+b.trunkHalfHeight;
 const rockBottom=a.p.y-ry, rockTop=a.p.y+ry;
 if(dist>=minDist||rockTop<=treeBottom||rockBottom>=treeTop)return false;
 if(rockBottom<treeTop && a.v.y<0 && a.p.y>treeTop){
   a.p.y=treeTop+ry;
   a.v.y=0;
   a.v.x*=FLOOR_FRICTION;
   a.v.z*=FLOOR_FRICTION;
   return true;
 }
 let nx=dx,nz=dz;
 if(dist<0.0001){nx=1;nz=0}else{nx/=dist;nz/=dist}
 const penetration=minDist-dist;
 a.p.x+=nx*penetration;
 a.p.z+=nz*penetration;
 const outward=a.v.x*nx+a.v.z*nz;
 if(outward<0){a.v.x-=nx*outward*1.35;a.v.z-=nz*outward*1.35}
 a.v.x*=.72;
 a.v.z*=.72;
 return true;
}
function resolveDynamicPair(a,b){const ox=overlapAxis(a,b,'x'),oy=overlapAxis(a,b,'y'),oz=overlapAxis(a,b,'z');if(ox<=0||oy<=0||oz<=0)return;let axis='x',pen=ox;if(oy<pen){axis='y';pen=oy}if(oz<pen){axis='z';pen=oz}const d=a.p[axis]-b.p[axis],sign=d>=0?1:-1;const total=a.mass+b.mass;a.p[axis]+=sign*pen*(b.mass/total);b.p[axis]-=sign*pen*(a.mass/total);const av=a.v[axis],bv=b.v[axis];const rel=av-bv;if(rel*sign<0){const e=.35;const j=-(1+e)*rel/(1/a.mass+1/b.mass);a.v[axis]+=sign*j/a.mass;b.v[axis]-=sign*j/b.mass}}
function resolvePlayerObstacle(o){
 if(!o||o.parent||o===held||(!o.isTrunkCollider&&!o.dynamic))return;
 const playerRadius=.38;
 const feet=camPos.y-1.35,head=camPos.y+.18;
 if(head<=o.p.y-o.s.y||feet>=o.p.y+o.s.y)return;
 const px=o.s.x+playerRadius-Math.abs(camPos.x-o.p.x);
 const pz=o.s.z+playerRadius-Math.abs(camPos.z-o.p.z);
 if(px<=0||pz<=0)return;
 if(px<pz)camPos.x+=camPos.x>=o.p.x?px:-px;
 else camPos.z+=camPos.z>=o.p.z?pz:-pz;
}
function collidePlayerWithScene(){for(const o of objects)resolvePlayerObstacle(o)}
function physics(dt){
 // Camera movement is deliberately separate from object physics so testing feels responsive.
 const f=flatForward(),r=right();let mx=input.moveX,my=input.moveY;let vx=r.x*mx+f.x*my,vz=r.z*mx+f.z*my;const ml=Math.hypot(vx,vz);if(ml>1){vx/=ml;vz/=ml}const speed=5.5;camPos.x+=vx*speed*dt;camPos.z+=vz*speed*dt;
 collidePlayerWithScene();
 camPos.x=clamp(camPos.x,-56,56);camPos.z=clamp(camPos.z,-56,56);
 const groundY=terrainHeight(camPos.x,camPos.z)+1.35;if(input.jump&&grounded){camVelY=7.2;grounded=false;input.jump=false}camVelY+=GRAVITY*dt;camPos.y+=camVelY*dt;if(camPos.y<=groundY){camPos.y=groundY;if(camVelY<0)camVelY=0;grounded=true} if(held){const target=camPos.add(forward().mul(grabDistance));held.p.x=target.x;held.p.y=target.y;held.p.z=target.z;held.v.set(0,0,0)}
 for(const o of objects){if(!o.dynamic||o.held)continue;o.v.y+=GRAVITY*dt;o.p.x+=o.v.x*dt;o.p.y+=o.v.y*dt;o.p.z+=o.v.z*dt;o.v.x*=Math.pow(AIR_DRAG,dt*60);o.v.z*=Math.pow(AIR_DRAG,dt*60)}
 for(let pass=0;pass<3;pass++){
  for(const a of objects)if(a.dynamic)for(const b of objects)if(!b.dynamic&&b!==a)resolveDynamicStatic(a,b);
  for(let i=0;i<objects.length;i++){const a=objects[i];if(!a.dynamic)continue;for(let j=i+1;j<objects.length;j++){const b=objects[j];if(b.dynamic)resolveDynamicPair(a,b)}}
 }
 for(const o of objects)if(o.dynamic){const floor=terrainHeight(o.p.x,o.p.z)+o.s.y;if(o.p.y<floor){o.p.y=floor;if(o.v.y<0)o.v.y=0;o.v.x*=.82;o.v.z*=.82}}
}

// ---------- Renderer ----------
let W=1,H=1;function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=Math.max(1,Math.floor(innerWidth*dpr));H=Math.max(1,Math.floor(innerHeight*dpr));if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;gl.viewport(0,0,W,H);perspective(proj,Math.PI/3,W/H,.05,150)}}addEventListener('resize',resize);resize();
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.disable(gl.CULL_FACE);gl.disable(gl.BLEND);gl.clearColor(.055,.075,.11,1);
const light=new Float32Array([4,8,-4]);
function draw(o){if(!o.visible)return;const p=o.parent?o.parent.p.add(o.p):o.p;modelMatrix(modelMat,p,o.r,o.s);normalMatrix(normalMat,modelMat);gl.uniformMatrix4fv(uModel,false,modelMat);gl.uniformMatrix3fv(uNormal,false,normalMat);gl.uniform3f(uColor,o.color[0],o.color[1],o.color[2]);gl.bindVertexArray(o.mesh.vao);gl.drawElements(gl.TRIANGLES,o.mesh.count,gl.UNSIGNED_INT,0);for(const c of o.children)draw(c)}
let last=performance.now(),acc=0;const FIX=1/120;
function render(now){
 for(const [id,r] of remotePlayers){r.x+=(r.tx-r.x)*.22;r.y+=(r.ty-r.y)*.22;r.z+=(r.tz-r.z)*.22;r.yaw+=(r.tyaw-r.yaw)*.22;const body=remoteMeshes.get(id);if(body){body.p.set(r.x,r.y-.9,r.z);body.r.y=r.yaw}}
 networkTick(now);
 document.getElementById('status').textContent=networkConnected?(held?'Multiplayer connected • Holding rock':'Multiplayer connected'):'Multiplayer reconnecting…';
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);view(viewMat,camPos,yaw,pitch);
 // Skybox: render first, with depth writes disabled, and keep it centred on the camera.
 const skyM=modelMat;modelMatrix(skyM,camPos,new V(),new V(85,85,85));
 gl.useProgram(skyProg);gl.depthMask(false);gl.uniformMatrix4fv(skyProj,false,proj);gl.uniformMatrix4fv(skyView,false,viewMat);gl.uniformMatrix4fv(skyModel,false,skyM);gl.uniform3f(skyCam,camPos.x,camPos.y,camPos.z);gl.bindVertexArray(meshes.box.vao);gl.drawElements(gl.TRIANGLES,meshes.box.count,gl.UNSIGNED_INT,0);gl.depthMask(true);
 // Main world.
 gl.useProgram(prog);gl.uniformMatrix4fv(uProj,false,proj);gl.uniformMatrix4fv(uView,false,viewMat);gl.uniform3fv(uLight,light);gl.uniform3f(uCam,camPos.x,camPos.y,camPos.z);for(const o of objects)if(!o.parent)draw(o)
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;while(acc>=FIX){physics(FIX);acc-=FIX}render(now);requestAnimationFrame(loop)}
// ---------- Input: keyboard + independent touch pointers ----------
const joy=document.getElementById('joy'),knob=document.getElementById('joyKnob'),lookZone=document.getElementById('lookZone');
let joyId=null,lookId=null,joyCenter={x:0,y:0};
function setKey(e,down){const k=e.key.toLowerCase();if(['w','a','s','d',' '].includes(k))e.preventDefault();input.keys[k]=down}
addEventListener('keydown',e=>{setKey(e,true);if(e.repeat)return;if(e.key===' ')input.jump=true;if(e.key.toLowerCase()==='e')toggleGrab();if(e.key.toLowerCase()==='f')dropHeld(true);if(e.key.toLowerCase()==='r')resetScene()});addEventListener('keyup',e=>setKey(e,false));
function button(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();fn();},{passive:false})}
button(document.getElementById('jump'),()=>input.jump=true);button(document.getElementById('grab'),toggleGrab);button(document.getElementById('throw'),()=>dropHeld(true));button(document.getElementById('reset'),resetScene);
joy.addEventListener('pointerdown',e=>{if(joyId!==null)return;joyId=e.pointerId;joy.setPointerCapture(e.pointerId);const r=joy.getBoundingClientRect();joyCenter.x=r.left+r.width/2;joyCenter.y=r.top+r.height/2;moveJoy(e)}, {passive:false});
function moveJoy(e){if(e.pointerId!==joyId)return;const dx=e.clientX-joyCenter.x,dy=e.clientY-joyCenter.y,max=50,len=Math.hypot(dx,dy)||1,k=Math.min(1,max/len);input.moveX=dx/max*k;input.moveY=-dy/max*k;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`;e.preventDefault()}
joy.addEventListener('pointermove',moveJoy,{passive:false});function endJoy(e){if(e.pointerId!==joyId)return;joyId=null;input.moveX=input.moveY=0;knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
let lastLX=0,lastLY=0;lookZone.addEventListener('pointerdown',e=>{if(lookId!==null)return;lookId=e.pointerId;lastLX=e.clientX;lastLY=e.clientY;lookZone.setPointerCapture(e.pointerId);e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(lookId!==null||joyId!==null)e.preventDefault()},{passive:false});
lookZone.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastLX,dy=e.clientY-lastLY;lastLX=e.clientX;lastLY=e.clientY;yaw+=dx*.006;pitch=clamp(pitch-dy*.006,-1.45,1.45);e.preventDefault()},{passive:false});function endLook(e){if(e.pointerId!==lookId)return;lookId=null}lookZone.addEventListener('pointerup',endLook);lookZone.addEventListener('pointercancel',endLook);
function keyboardMove(){let x=0,y=0;if(input.keys.a)x-=1;if(input.keys.d)x+=1;if(input.keys.w)y+=1;if(input.keys.s)y-=1;const l=Math.hypot(x,y)||1;return [x/l,y/l]}
const oldPhysics=physics;
physics=function(dt){const k=keyboardMove();if(joyId===null){input.moveX=k[0];input.moveY=k[1]}oldPhysics(dt);};
requestAnimationFrame(loop);
